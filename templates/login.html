
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | PetRescue</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: #f3f8f3;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: white;
            box-shadow: 0 2px 10px #0000000d;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #16865b;
            text-decoration: none;
        }

        .btn-nav {
            color: #16865b;
            text-decoration: none;
            font-weight: bold;
        }

        .login-contenedor {
            width: 90%;
            max-width: 420px;
            margin: 60px auto;
            padding: 35px;
            box-sizing: border-box;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px #1c422012;
        }

        .login-contenedor h1 {
            margin-bottom: 10px;
            color: #20382d;
            text-align: center;
        }

        .descripcion {
            color: #718076;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #30483a;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d5dfd7;
            border-radius: 8px;
            font-size: 15px;
        }

        .campo input:focus {
            outline: 2px solid #16865b;
            border-color: transparent;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #16865b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #116b48;
        }

        .mensaje-error {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #fde8e7;
            color: #a12622;
            text-align: center;
        }

        .volver {
            display: block;
            margin-top: 22px;
            color: #16865b;
            text-align: center;
            text-decoration: none;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #718076;
            text-align: center;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="/" class="logo">🐾 PetRescue</a>
        <a href="/" class="btn-nav">Volver al inicio</a>
    </header>

    <main class="login-contenedor">

        <h1>Bienvenido</h1>

        <p class="descripcion">
            Inicia sesión para acceder al panel de administración
            de PetRescue.
        </p>

        {% if error %}
            <div class="mensaje-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="admin@petrescue.com"
                    maxlength="150"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Iniciar sesión
            </button>

        </form>

        <a href="/" class="volver">
            ← Volver al catálogo de animales
        </a>

    </main>

    <footer>
        <p>PetRescue © 2026 — Un hogar, una nueva oportunidad.</p>
    </footer>

</body>
</html>
